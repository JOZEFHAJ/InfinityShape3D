<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinity Shape 3D - Page 2</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            flex: 1;
        }
        .section-title {
            text-align: center;
            margin-bottom: 30px;
            color: #111;
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }
        .product-card {
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .product-img-wrap {
            width: 100%;
            height: 220px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f9f9f9;
        }
        .product-img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .product-info {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .product-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }
        .price {
            font-weight: bold;
            color: #e53935;
        }
        .btn-custom {
            background-color: #e53935;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
        }
        /* تصميم أزرار التنقل في الأسفل */
        .pagination-nav {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 20px;
            background-color: #fff;
            box-shadow: 0 -2px 5px rgba(0,0,0,0.05);
            margin-top: 40px;
        }
        .page-btn {
            padding: 10px 20px;
            border: 1px solid #ccc;
            background-color: #fff;
            color: #333;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            transition: 0.2s;
        }
        .page-btn.active, .page-btn:hover {
            background-color: #e53935;
            color: white;
            border-color: #e53935;
        }
    </style>
</head>
<body>

    <div class="container" id="products">
        <h2 class="section-title">Our Products - Page 2</h2>
        
        <div class="products-grid">
            <!-- Product 1 -->
            <div class="product-card">
                <div class="product-img-wrap">
                    <img src="29.PNG" alt="Product 3.12">
                </div>
                <div class="product-info">
                    <h3>Product 3.12</h3>
                    <p>Infinity Shape 3D: Crafting infinite possibilities with high-precision 3D printing.</p>
                    <div class="product-footer">
                        <span class="price">5 DT</span>
                        <button class="btn-custom">Order Now</button>
                    </div>
                </div>
            </div>

            <!-- Product 2 -->
            <div class="product-card">
                <div class="product-img-wrap">
                    <img src="" alt="Product 0">
                </div>
                <div class="product-info">
                    <h3>Product 0</h3>
                    <p>Infinity Shape 3D: Crafting infinite possibilities with high-precision 3D printing.</p>
                    <div class="product-footer">
                        <span class="price">0 DT</span>
                        <button class="btn-custom">Order Now</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- الأزرار الثلاثة للتنقل في الأسفل -->
    <div class="pagination-nav">
        <a href="index.html" class="page-btn">1</a>
        <a href="page2.html" class="page-btn active">2</a>
        <a href="page3.html" class="page-btn">3</a>
    </div>

</body>
</html>
